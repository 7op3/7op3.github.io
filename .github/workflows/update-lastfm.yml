name: Update Last.fm data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "lastfm-data"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and publish recent Last.fm track
        uses: actions/github-script@v7
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        with:
          script: |
            const apiKey = process.env.LASTFM_API_KEY;
            if (!apiKey) throw new Error('LASTFM_API_KEY is not configured.');

            const params = new URLSearchParams({
              method: 'user.getrecenttracks',
              user: 'ropeburns',
              api_key: apiKey,
              format: 'json',
              limit: '1'
            });
            const response = await fetch(`https://ws.audioscrobbler.com/2.0/?${params}`);
            if (!response.ok) throw new Error(`Last.fm returned ${response.status}`);

            const payload = await response.json();
            if (payload.error) throw new Error(payload.message || 'Last.fm returned an error.');

            const tracks = payload.recenttracks?.track;
            const track = Array.isArray(tracks) ? tracks[0] : tracks;
            const artist = track?.artist?.['#text'] || track?.artist?.name || '';
            const images = Array.isArray(track?.image) ? track.image : [];
            const image = images.find((item) => item.size === 'extralarge' && item['#text'])
              || images.find((item) => item.size === 'large' && item['#text'])
              || images.find((item) => item['#text']);
            const data = track?.name && artist ? {
              available: true,
              nowPlaying: track['@attr']?.nowplaying === 'true',
              name: track.name,
              artist,
              album: track.album?.['#text'] || '',
              image: image?.['#text'] || '',
              url: track.url || 'https://www.last.fm/user/ropeburns',
              timestamp: track.date?.uts || ''
            } : { available: false };
            const content = `${JSON.stringify(data, null, 2)}\n`;

            const { owner, repo } = context.repo;
            const branch = 'lastfm-data';
            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              const repository = await github.rest.repos.get({ owner, repo });
              const baseRef = await github.rest.git.getRef({
                owner,
                repo,
                ref: `heads/${repository.data.default_branch}`
              });
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${branch}`,
                sha: baseRef.data.object.sha
              });
            }

            let existing;
            try {
              existing = await github.rest.repos.getContent({ owner, repo, path: 'lastfm.json', ref: branch });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const previous = existing && !Array.isArray(existing.data)
              ? Buffer.from(existing.data.content, 'base64').toString('utf8')
              : '';
            if (previous === content) {
              core.info('Last.fm data has not changed.');
              return;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: 'lastfm.json',
              branch,
              message: 'Update Last.fm listening data',
              content: Buffer.from(content).toString('base64'),
              sha: existing && !Array.isArray(existing.data) ? existing.data.sha : undefined
            });
