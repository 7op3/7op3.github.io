name: Update Last.fm data

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: "lastfm-data"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch Last.fm data and update site/_data/lastfm.json
        uses: actions/github-script@v7
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USERNAME: ${{ secrets.LASTFM_USERNAME }}
        with:
          script: |
            const fs = require('fs');
            const apiKey = process.env.LASTFM_API_KEY;
            const user = process.env.LASTFM_USERNAME || 'ropeburns';

            if (!apiKey) {
              console.log('LASTFM_API_KEY secret is not set, skipping update');
              return;
            }

            const BASE = 'https://ws.audioscrobbler.com/2.0/';

            async function lfm(method, extra = {}) {
              const params = new URLSearchParams({ method, user, api_key: apiKey, format: 'json', ...extra });
              const res = await fetch(`${BASE}?${params}`);
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              const json = await res.json();
              if (json.error) throw new Error(json.message || `error ${json.error}`);
              return json;
            }

            const asArray = (x) => (Array.isArray(x) ? x : x ? [x] : []);
            const toInt = (x) => parseInt(x, 10) || 0;
            const artistName = (a) => {
              if (!a) return '';
              if (typeof a === 'string') return a;
              return a.name || a['#text'] || '';
            };
            const pickImage = (images, size) => {
              const arr = asArray(images);
              const found = arr.find((i) => i.size === size && i['#text']) || arr.find((i) => i['#text']);
              return found ? found['#text'] : '';
            };
            // Last.fm serves this placeholder for missing artwork (mostly artists/tracks)
            const PLACEHOLDER_HASH = '2a96cbd8b46e442fc41c2b86b821562f';
            const hasArt = (url) => Boolean(url) && !url.includes(PLACEHOLDER_HASH);

            async function safe(name, fn) {
              try {
                return await fn();
              } catch (err) {
                console.log(`${name} failed: ${err.message}`);
                return null;
              }
            }

            // Sequential calls: ~5 requests every 6 hours, far below Last.fm's rate limit
            const info = await safe('user.getinfo', () => lfm('user.getinfo'));
            const topArtists = await safe('user.gettopartists', () => lfm('user.gettopartists', { period: 'overall', limit: '50' }));
            const topAlbums = await safe('user.gettopalbums', () => lfm('user.gettopalbums', { period: 'overall', limit: '50' }));
            const topTracks = await safe('user.gettoptracks', () => lfm('user.gettoptracks', { period: 'overall', limit: '50' }));
            const recent = await safe('user.getrecenttracks', () => lfm('user.getrecenttracks', { limit: '50' }));

            if (!info && !topArtists && !topAlbums && !topTracks && !recent) {
              console.log('All Last.fm requests failed, keeping existing data');
              return;
            }

            const rawArtists = asArray(topArtists && topArtists.topartists && topArtists.topartists.artist);
            const rawAlbums = asArray(topAlbums && topAlbums.topalbums && topAlbums.topalbums.album);
            const rawTracks = asArray(topTracks && topTracks.toptracks && topTracks.toptracks.track);
            const rawRecent = asArray(recent && recent.recenttracks && recent.recenttracks.track);

            // Last.fm rarely has artist art; top up from Deezer (artists/tracks,
            // keyed by name) and Cover Art Archive (album releases, via MBID).
            const artistNames = new Set();
            const wantArtist = (name, images) => {
              if (name && !hasArt(pickImage(images, 'large'))) artistNames.add(name);
            };
            rawArtists.forEach((a) => wantArtist(a.name, a.image));
            rawTracks.forEach((t) => wantArtist(artistName(t.artist), t.image));

            const releaseMbids = new Set();
            rawAlbums.forEach((a) => {
              if (a.mbid && !hasArt(pickImage(a.image, 'large'))) releaseMbids.add(a.mbid);
            });

            const normName = (s) => String(s || '').trim().toLowerCase();
            const artistArt = {};
            const names = [...artistNames];
            for (let i = 0; i < names.length; i += 5) {
              await Promise.all(names.slice(i, i + 5).map(async (name) => {
                try {
                  const res = await fetch(`https://api.deezer.com/search/artist?q=${encodeURIComponent(name)}&limit=5`);
                  if (!res.ok) return;
                  const list = asArray((await res.json()).data);
                  const match = list.find((a) => normName(a.name) === normName(name)) || list[0];
                  const pic = match && (match.picture_big || match.picture_medium || match.picture_small);
                  if (pic) artistArt[normName(name)] = pic;
                } catch (err) {
                  // No art available; the item falls back to the placeholder tile
                }
              }));
            }

            const releaseArt = {};
            const mbids = [...releaseMbids];
            for (let i = 0; i < mbids.length; i += 5) {
              await Promise.all(mbids.slice(i, i + 5).map(async (mbid) => {
                try {
                  const res = await fetch(`https://coverartarchive.org/release/${mbid}/front-250`, { redirect: 'manual' });
                  const loc = res.headers.get('location');
                  if (res.status >= 300 && res.status < 400 && loc) {
                    releaseArt[mbid] = loc.startsWith('http') ? loc : `https://coverartarchive.org${loc}`;
                  } else if (res.status === 200) {
                    releaseArt[mbid] = `https://coverartarchive.org/release/${mbid}/front-250`;
                  }
                } catch (err) {
                  // No art available; the item falls back to the placeholder tile
                }
              }));
            }
            console.log(`Art lookups: ${Object.keys(artistArt).length}/${names.length} artists, ${Object.keys(releaseArt).length}/${mbids.length} releases`);

            const artForArtist = (name, images) => {
              const lfm = pickImage(images, 'large');
              if (hasArt(lfm)) return lfm;
              return artistArt[normName(name)] || '';
            };
            const artForRelease = (mbid, images) => {
              const lfm = pickImage(images, 'large');
              if (hasArt(lfm)) return lfm;
              return releaseArt[mbid] || '';
            };

            const data = {
              fetchedAt: new Date().toISOString(),
              user,
              profileUrl: `https://www.last.fm/user/${user}`,
              stats: info && info.user ? { playcount: toInt(info.user.playcount) } : null,
              topArtists: rawArtists.map((a) => ({
                name: a.name || '',
                plays: toInt(a.playcount),
                url: a.url || '',
                image: artForArtist(a.name, a.image)
              })),
              topAlbums: rawAlbums.map((a) => ({
                name: a.name || '',
                artist: artistName(a.artist),
                plays: toInt(a.playcount),
                url: a.url || '',
                image: artForRelease(a.mbid, a.image)
              })),
              topTracks: rawTracks.map((t) => ({
                name: t.name || '',
                artist: artistName(t.artist),
                plays: toInt(t.playcount),
                url: t.url || '',
                image: artForArtist(artistName(t.artist), t.image)
              })),
              recentTracks: rawRecent.map((t) => {
                const d = t.date || {};
                return {
                  name: t.name || '',
                  artist: artistName(t.artist),
                  album: (t.album && t.album['#text']) || '',
                  url: t.url || `https://www.last.fm/user/${user}`,
                  image: hasArt(pickImage(t.image, 'large')) ? pickImage(t.image, 'large') : '',
                  date: d['#text'] || '',
                  uts: toInt(d.uts),
                  nowPlaying: t['@attr'] && t['@attr'].nowplaying === 'true'
                };
              })
            };

            fs.writeFileSync('site/_data/lastfm.json', JSON.stringify(data, null, 2) + '\n');
            console.log('Last.fm data updated successfully');

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/_data/lastfm.json
          git commit -m "Update Last.fm data" || true
          git push
