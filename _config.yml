title: Amelia
tagline: Personal site of Amelia
description: >-
  Personal website of Amelia (7op3) — links, recommendations, and the occasional
  work in progress.
author: Amelia
email:
url: "https://seven.oops.wtf"

# Nav bar order (top right of every page).
header_pages:
  - socials.md
  - recs.md
  - projects.md
  - contact.md
  - anilist.md

# Social links. The /socials/ page always shows every entry; the sidebar
# "Elsewhere" box skips any entry flagged `sidebar: false`.
socials:
  - { name: YouTube, url: "https://youtube.com/@7op3" }
  - { name: Twitter / X, url: "https://twitter.com/shockhorrors" }
  - { name: Last.fm, url: "https://www.last.fm/user/ropeburns" }
  - { name: GitHub, url: "https://github.com/7op3" }
  - { name: AniList, url: "https://anilist.co/user/warps" }

plugins:
  - jekyll-seo-tag
  - jekyll-feed

exclude:
  - Gemfile
  - Gemfile.lock
  - assets/main.scss
  - README.md
  - vendor
  - src
  - wrangler.toml
  - wrangler.worker.toml
  - node_modules
  - package.json
  - package-lock.json
include:
  - _data