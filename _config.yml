title: Amelia
tagline: Personal site of Amelia
description: >-
  Personal website of Amelia (7op3) — links, recommendations, and the occasional
  work in progress.
author: Amelia
email:
url: "https://seven.is-a.dev"

theme: minima

# Nav bar order (top right of every page).
header_pages:
  - socials.md
  - recs.md

# Minima social links (shown in the footer).
minima:
  social_links:
    - { platform: youtube, user_url: "https://youtube.com/@7op3" }
    - { platform: twitter, user_url: "https://twitter.com/autisticrobots" }

plugins:
  - jekyll-seo-tag
  - jekyll-feed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
